[package]
name = "archangel_graph"
description = "The import graph of a repository: its source files, their imports and where each import resolves."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Turns on the fail points that the fault-control tests use. Release builds never enable it.
failpoints = ["fail/failpoints"]

[lints]
workspace = true

[dependencies]
dunce = "1.0.5"
fail = "0.5.1"
ignore = "0.4.34"
memchr = "2.8.3"
oxc_allocator = "0.133.0"
oxc_ast = "0.133.0"
oxc_ast_visit = "0.133.0"
oxc_diagnostics = "0.133.0"
oxc_parser = "0.133.0"
oxc_resolver = { version = "11.23.0", features = ["yarn_pnp"] }
pnp = "0.12.12"
oxc_span = "0.133.0"
oxc_syntax = "0.133.0"
rayon = "1.12.0"
serde_json = "1.0.154"

[dev-dependencies]
archangel_testkit.workspace = true
serde_json = "1.0.154"
