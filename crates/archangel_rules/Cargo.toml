[package]
name = "archangel_rules"
description = "Archangel's rules: putting files into elements and checking every import against every rule."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Turns on the fail points that the fault-control tests use. Release builds never enable it.
failpoints = ["fail/failpoints", "archangel_graph/failpoints"]

[lints]
workspace = true

[dependencies]
archangel_config.workspace = true
archangel_graph.workspace = true
fail = "0.5.1"
petgraph = "0.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
archangel_testkit.workspace = true
heck = "0.5.0"
proptest = "1.12.0"
