[package]
name = "archangel_engine"
description = "Archangel's engine: a session that loads the config, builds the graph, checks it, and runs the rule examples."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Turns on the fail points that the fault-control tests use. Release builds never enable it.
failpoints = ["fail/failpoints", "archangel_graph/failpoints", "archangel_rules/failpoints"]

[lints]
workspace = true

[dependencies]
archangel_config.workspace = true
archangel_graph.workspace = true
archangel_rules.workspace = true
crossbeam-channel = "0.5.17"
dunce = "1.0.5"
fail = "0.5.1"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
archangel_testkit.workspace = true
proptest = "1.12.0"
proptest-state-machine = "0.9.0"
