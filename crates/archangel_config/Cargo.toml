[package]
name = "archangel_config"
description = "The archangel config: elements, patterns and rules, loaded and validated."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# This crate has no fail points of its own; the feature exists so the workspace can turn fail
# points on everywhere with one flag.
failpoints = []

[lints]
workspace = true

[dependencies]
jsonschema = { version = "0.60.2", default-features = false }
regex = "1.13.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
strsim = "0.11.1"

[dev-dependencies]
proptest = "1.12.0"
archangel_testkit.workspace = true
