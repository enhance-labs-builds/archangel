# The repositories the scheduled benchmark checks. Each public one is pinned to a tag, so a change in
# the numbers is a change in archangel, not in the repository.

[[repo]]
name = "vscode"
url = "https://github.com/microsoft/vscode.git"
tag = "1.144.0"
config = "benches/configs/vscode.json"

[[repo]]
name = "excalidraw"
url = "https://github.com/excalidraw/excalidraw.git"
tag = "v0.18.1"
config = "benches/configs/excalidraw.json"

# A repository that scripts/generate-repo.mjs writes: 10,000 files of 100 lines, a million in all,
# in three layers of features with imports between them.
[[generated]]
name = "million-lines"
files = 10000
lines = 100
