<svg xmlns="http://www.w3.org/2000/svg" width="760" height="204" viewBox="0 0 760 204" role="img" aria-label="Seconds to check a 9,800-file TypeScript monorepo: archangel 1.9 s for all 400 rules; ESLint 29.2 s, Steiger 21.4 s and dependency-cruiser 17.0 s for their own rules">
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="176" y="26.0" text-anchor="end" font-weight="700" fill="#e6edf3" font-size="15">archangel</text>
<text x="176" y="42.0" text-anchor="end" fill="#9198a1" font-size="12">all 400 rules</text>
<rect x="190" y="16" width="31.7" height="22" rx="4" fill="#a371f7"/>
<text x="231.7" y="32.0" font-weight="700" fill="#e6edf3" font-size="15">1.9 s</text>
<text x="176" y="72.0" text-anchor="end" font-weight="600" fill="#e6edf3" font-size="15">ESLint</text>
<text x="176" y="88.0" text-anchor="end" fill="#9198a1" font-size="12">boundaries + check-file</text>
<rect x="190" y="62" width="487.2" height="22" rx="4" fill="#3d444d"/>
<text x="687.2" y="78.0" font-weight="600" fill="#e6edf3" font-size="15">29.2 s</text>
<text x="176" y="118.0" text-anchor="end" font-weight="600" fill="#e6edf3" font-size="15">Steiger</text>
<text x="176" y="134.0" text-anchor="end" fill="#9198a1" font-size="12">Feature-Sliced Design</text>
<rect x="190" y="108" width="357.2" height="22" rx="4" fill="#3d444d"/>
<text x="557.2" y="124.0" font-weight="600" fill="#e6edf3" font-size="15">21.4 s</text>
<text x="176" y="164.0" text-anchor="end" font-weight="600" fill="#e6edf3" font-size="15">dependency-cruiser</text>
<text x="176" y="180.0" text-anchor="end" fill="#9198a1" font-size="12">import rules</text>
<rect x="190" y="154" width="283.3" height="22" rx="4" fill="#3d444d"/>
<text x="483.3" y="170.0" font-weight="600" fill="#e6edf3" font-size="15">17.0 s</text>
</g>
</svg>
