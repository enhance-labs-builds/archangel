[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/enhance-labs-builds/archangel"
homepage = "https://github.com/enhance-labs-builds/archangel"
keywords = ["architecture", "typescript", "imports", "lint", "boundaries"]
categories = ["development-tools", "command-line-utilities"]

# Every lint the project uses is at `deny`, so a warning cannot be tolerated locally and fixed
# later in CI. A lint that turns out to be noisy is switched off here with a reason, never
# silenced at the call site.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
let_underscore_drop = "deny"
unfulfilled_lint_expectations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# An exception names the lint and its reason, and `expect` fails once the lint stops firing, so
# exceptions can only shrink.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Errors are `Result` values until the command line or the language server turns them into
# output, so production code never unwraps or panics. clippy.toml allows these in tests.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
exit = "deny"
# No debt: deferred work is done now or not at all.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Output goes through the reporter, so every result has one format.
print_stdout = "deny"
print_stderr = "deny"
missing_assert_message = "deny"
mod_module_files = "deny"


[workspace.dependencies]
archangel_config = { path = "crates/archangel_config", version = "0.1.1" }
archangel_graph = { path = "crates/archangel_graph", version = "0.1.1" }
archangel_rules = { path = "crates/archangel_rules", version = "0.1.1" }
archangel_engine = { path = "crates/archangel_engine", version = "0.1.1" }
archangel_lsp = { path = "crates/archangel_lsp", version = "0.1.1" }
archangel_testkit = { path = "crates/archangel_testkit" }

[profile.release]
lto = "thin"
codegen-units = 1

# Dependencies such as the oxc parser are built with optimisations in tests too, so that the
# simulated sessions and the large-repository tests run in seconds; archangel's own crates stay
# unoptimised, so that they build fast and debug well. Dependencies carry no debug info: linked into
# every test binary, theirs filled the CI runner's disk.
[profile.dev.package."*"]
opt-level = 3
debug = false
